server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # PWA: the service worker and manifest must always be revalidated, or
    # browsers would keep an old worker for a year (exact matches beat the
    # long-cache regex below)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Handle SPA routing for the main dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle SPA routing for the Blue.cc standalone app
    location /blue {
        try_files $uri $uri/ /blue/index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }
}
